<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>EV Bike Telemetry & Actuation Dashboard</title>
  
  <!-- Leaflet Maps CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --bg: #080b10; --card: #121821; --card2: #0e141c; --line: #1f2937;
      --tx: #e8eef7; --dim: #7d8da3; --ok: #00e08a; --warn: #ffb020;
      --bad: #ff4d5e; --acc: #38bdf8; --vio: #a78bfa;
    }
    body {
      background: var(--bg); color: var(--tx);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px; padding-bottom: 40px; max-width: 520px; margin: 0 auto;
    }

    /* Target Host Configuration Bar */
    .config-bar { display: flex; gap: 8px; margin-bottom: 14px; background: var(--card); padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
    .config-bar input { flex: 1; background: var(--card2); border: 1px solid var(--line); color: var(--tx); padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; }
    .config-bar button { background: var(--acc); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .hd h1 { font-size: 18px; font-weight: 700; }
    .hd .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .pill { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative; overflow: hidden; }
    .gauge { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .gwrap { position: relative; width: 180px; height: 180px; }
    svg { transform: rotate(-90deg); }
    .gtx { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .gtx b { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .gtx small { font-size: 10px; color: var(--dim); letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }

    .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
    .tile .k { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .tile .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tile .u { font-size: 11px; color: var(--dim); margin-left: 1px; }

    /* iOS Toggle Switches */
    .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .switch-row:last-child { border-bottom: none; }
    .switch-label { font-size: 14px; font-weight: 600; }
    .switch-sub { font-size: 10px; color: var(--dim); display: block; }
    .ios-switch { position: relative; width: 52px; height: 30px; appearance: none; background: #2b3648; border-radius: 16px; outline: none; transition: .3s; cursor: pointer; }
    .ios-switch:checked { background: var(--ok); }
    .ios-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; background: #fff; border-radius: 50%; transition: .3s; }
    .ios-switch:checked::after { transform: translateX(22px); }
    .ios-switch:disabled { opacity: 0.3; cursor: not-allowed; }

    .res { margin-top: 10px; padding: 10px; border-radius: 8px; background: var(--card2); border: 1px solid var(--line); font-size: 12px; text-align: center; font-weight: 600; }
    .res.ok { color: var(--ok); border-color: rgba(0,224,138,0.4); }
    .res.err { color: var(--bad); border-color: rgba(255,77,94,0.4); }
    .res.wait { color: var(--warn); }

    .ttl { font-size: 11px; color: var(--dim); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .cells { display: flex; flex-direction: column; gap: 5px; }
    .cell { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .cell .n { width: 22px; color: var(--dim); }
    .bar { flex: 1; height: 14px; background: var(--card2); border-radius: 4px; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg, #0e7490, var(--acc)); transition: width .4s; }
    .fill.hi { background: linear-gradient(90deg, #a16207, #fbbf24); }
    .fill.lo { background: linear-gradient(90deg, #7f1d1d, #f87171); }
    .cell .mv { width: 48px; text-align: right; font-weight: 600; }

    #map { height: 220px; width: 100%; margin: 0 -16px -16px; background: var(--card2); }
    .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    .off { opacity: .4; filter: saturate(.3); transition: .3s; }
  </style>
</head>
<body>

<div class="config-bar">
  <input type="text" id="target-host" placeholder="Local IP / Domain (or leave for Firebase Cloud)">
  <button onclick="saveHost()">Set Mode</button>
</div>

<div class="hd">
  <div><h1 id="bid">EV Bike</h1><div class="sub" id="sub">Connecting...</div></div>
  <div class="pill"><span class="dot" id="dot"></span><span id="lnk">OFFLINE</span></div>
</div>

<div id="wrap">
  <div class="card gauge">
    <div class="gwrap">
      <svg width="180" height="180" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="86" fill="none" stroke="#182130" stroke-width="15"/>
        <circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="var(--ok)" stroke-width="15"
                stroke-linecap="round" stroke-dasharray="540.4" stroke-dashoffset="540.4"/>
      </svg>
      <div class="gtx"><b id="soc">--</b><small>State of Charge</small></div>
    </div>
  </div>

  <div class="card">
    <div class="ttl">MOSFET Control (iOS Switches)</div>
    <div class="switch-row">
      <div><span class="switch-label">Charge MOSFET</span><span class="switch-sub" id="chg-st">State: --</span></div>
      <input type="checkbox" class="ios-switch" id="sw-chg" onchange="toggleFet('chg', this.checked)">
    </div>
    <div class="switch-row">
      <div><span class="switch-label">Discharge MOSFET</span><span class="switch-sub" id="dsg-st">State: --</span></div>
      <input type="checkbox" class="ios-switch" id="sw-dsg" onchange="toggleFet('dsg', this.checked)">
    </div>
    <div class="res" id="res">System Ready</div>
  </div>

  <div class="card">
    <div class="ttl">GPS & Trajectory (30m) <span id="spd" style="color:var(--tx)">0.0 km/h</span></div>
    <div id="map"></div>
  </div>

  <div class="g3">
    <div class="tile"><div class="k">Voltage</div><div class="val"><span id="v">--</span><span class="u">V</span></div></div>
    <div class="tile"><div class="k">Current</div><div class="val"><span id="i">--</span><span class="u">A</span></div></div>
    <div class="tile"><div class="k">Power</div><div class="val"><span id="kw">--</span><span class="u">kW</span></div></div>
  </div>

  <div class="g3">
    <div class="tile"><div class="k">Remaining</div><div class="val"><span id="ah">--</span><span class="u">Ah</span></div></div>
    <div class="tile"><div class="k">Temp</div><div class="val"><span id="tp">--</span><span class="u">°C</span></div></div>
    <div class="tile"><div class="k">Cycles</div><div class="val" id="cyc">--</div></div>
  </div>

  <div class="card">
    <div class="ttl"><span>Cell Voltage Balance</span><span id="dmv">-- mV</span></div>
    <div class="cells" id="cl"></div>
  </div>
</div>

<script type="module">
  // Import Firebase Web SDK Modules
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

  // Official Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCd0iCbS4KB_EO2cMjwEhCcw0MfFzMTEr4",
    authDomain: "ev-bike-fleet-telematics.firebaseapp.com",
    databaseURL: "https://ev-bike-fleet-telematics-default-rtdb.firebaseio.com",
    projectId: "ev-bike-fleet-telematics",
    storageBucket: "ev-bike-fleet-telematics.firebasestorage.app",
    messagingSenderId: "436426285633",
    appId: "1:436426285633:web:d79b683d51214caac0dcc0",
    measurementId: "G-5DRQNRHCLP"
  };

  const $ = i => document.getElementById(i);
  const C = 540.4;
  let map, mark, path, isExecuting = false;

  let localHost = localStorage.getItem('ev_local_host') || '';
  $('target-host').value = localHost;

  window.saveHost = () => {
    let val = $('target-host').value.trim();
    if (val && !val.startsWith('http')) val = 'http://' + val;
    localStorage.setItem('ev_local_host', val);
    location.reload();
  };

  function initMap(lat, lng) {
    map = L.map('map').setView([lat, lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    mark = L.circleMarker([lat, lng], { color: '#080b10', weight: 2, fillColor: 'var(--acc)', fillOpacity: 1, radius: 8 }).addTo(map);
    path = L.polyline([], { color: 'var(--acc)', weight: 4, opacity: 0.8 }).addTo(map);
  }

  function paint(d) {
    if (!d) return;
    $('bid').textContent = d.id || "EVBIKE";
    $('sub').textContent = (d.ns || 0) + 'S LiFePO4 · ' + (d.ahn || 0) + ' Ah · ' + (d.rssi || 0) + ' dBm';

    const on = d.ok == 1;
    $('dot').className = 'dot' + (on ? ' on' : '');
    $('lnk').textContent = on ? 'LIVE' : 'OFFLINE';
    $('wrap').className = on ? '' : 'off';

    const soc = d.soc || 0;
    $('soc').textContent = soc.toFixed(1);
    $('arc').style.strokeDashoffset = C - (C * Math.min(soc, 100) / 100);
    $('arc').style.stroke = soc > 50 ? 'var(--ok)' : soc > 20 ? 'var(--warn)' : 'var(--bad)';

    $('v').textContent = (d.v || 0).toFixed(1);
    
    // Amperes Formatting
    const current = d.i || 0;
    $('i').textContent = current.toFixed(1);
    $('i').style.color = current < -0.1 ? 'var(--acc)' : current > 0.1 ? 'var(--ok)' : 'var(--tx)';
    
    $('kw').textContent = Math.abs(d.kw || 0).toFixed(2);
    $('ah').textContent = (d.ah || 0).toFixed(1);
    $('tp').textContent = d.t !== undefined ? d.t : '--';
    $('cyc').textContent = d.cyc || 0;
    $('spd').textContent = (d.spd || 0).toFixed(1) + ' km/h';

    // Update iOS Switches
    if (!isExecuting) {
      $('sw-chg').checked = (d.chg == 1);
      $('sw-dsg').checked = (d.dsg == 1);
      $('sw-chg').disabled = !on || d.busy == 1;
      $('sw-dsg').disabled = !on || d.busy == 1;
      $('chg-st').textContent = 'State: ' + (d.chg ? 'ON' : 'OFF');
      $('dsg-st').textContent = 'State: ' + (d.dsg ? 'ON' : 'OFF');
    }

    if (d.lat && d.lng && d.lat !== 0) {
      if (!map) initMap(d.lat, d.lng);
      else {
        mark.setLatLng([d.lat, d.lng]);
        if (!map.getBounds().contains([d.lat, d.lng])) map.panTo([d.lat, d.lng]);
        if (d.trk && d.trk.length > 0) path.setLatLngs(d.trk);
      }
    }

    $('dmv').textContent = 'Δ ' + (d.dmv || 0) + ' mV';
    let h = '';
    if (d.c) {
      const lo = (d.mn || 0) - 3, hi = (d.mx || 0) + 3, sp = Math.max(hi - lo, 1);
      d.c.forEach((mv, k) => {
        const w = Math.max(3, Math.min(100, (mv - lo) / sp * 100));
        const cls = (k + 1) == d.mxi ? 'fill hi' : (k + 1) == d.mni ? 'fill lo' : 'fill';
        h += `<div class="cell"><span class="n">${k+1}</span><div class="bar"><div class="${cls}" style="width:${w}%"></div></div><span class="mv">${mv}</span></div>`;
      });
    }
    $('cl').innerHTML = h;
  }

  window.toggleFet = (fet, state) => {
    isExecuting = true;
    $('res').textContent = 'Sending Command...';
    $('res').className = 'res wait';
    $('sw-chg').disabled = true;
    $('sw-dsg').disabled = true;

    // Send control request to local ESP32 endpoint
    let baseUrl = localHost || 'http://evbike-test.local';
    fetch(`${baseUrl}/api/mos?fet=${fet}&on=${state ? 1 : 0}`)
      .then(r => r.text())
      .then(t => {
        $('res').textContent = t;
        $('res').className = 'res ' + (t.includes('CONFIRMED') || t.includes('SENT') ? 'ok' : 'err');
        setTimeout(() => { isExecuting = false; }, 1500);
      })
      .catch(() => {
        $('res').textContent = 'Command Failed (Ensure device is connected on local LAN)';
        $('res').className = 'res err';
        setTimeout(() => { isExecuting = false; }, 1500);
      });
  };

  // Connection Engine: Local LAN vs Firebase Cloud Realtime Stream
  if (localHost) {
    async function tick() {
      try {
        const r = await fetch(localHost + '/api/data', { cache: 'no-store' });
        paint(await r.json());
      } catch (e) {}
    }
    setInterval(tick, 1500);
    tick();
  } else {
    // Default: Firebase Realtime Streaming
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    onValue(ref(db, 'bike'), (snapshot) => {
      paint(snapshot.val());
    });
  }
</script>
</body>
</html>
